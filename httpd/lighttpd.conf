# All responses should be JSON:
index-file.names            := ( "index.json" )
mimetype.assign   := ( "" => "application/json" )

# These files must be named 'error-404.html' etc., even though they contain
# JSON, because lighttpd doesn't support any other naming for error pages.
server.errorfile-prefix = "PATH_TO_REPO/openADR-static-vtn/httpd/error-"

# Remove query strings and avoid redirection responses:
server.modules += ( "mod_rewrite" )
url.rewrite-repeat = ( "^/([^?]*)\?.*$" => "/$1",
		"^/programs$" => "/programs/",
		"^/events$" => "/events/" )
